name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Remove credentials, private prompts, and identifying metadata. Report vulnerabilities through the security policy."
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and the affected endpoint or dashboard feature.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal sanitized example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Dashboard revision, Gufo version, Python or Docker version, operating system, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant status codes or pipeline counters. Do not attach databases or .env files.
