name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.12.21
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Verify dependency export
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
      - name: Test
        run: uv run --locked pytest
      - name: Audit runtime dependencies
        if: matrix.python-version == '3.12'
        run: uvx pip-audit==2.10.1 -r requirements.txt --no-deps --disable-pip
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy app
      - name: Build Python distributions
        run: uv build

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t gufo-dashboard:ci .
      - name: Check a non-default port
        run: |
          docker run -d --name dashboard-ci -e DASHBOARD_PORT=18081 gufo-dashboard:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dashboard-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs dashboard-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f dashboard-ci || true
