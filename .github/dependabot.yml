version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    # Generated from uv.lock; update the manifest/lockfile, then regenerate this export.
    exclude-paths:
      - requirements.txt
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
